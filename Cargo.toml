[workspace]
resolver = "3"
members = [
    "apps/ui",
    "apps/desktop",
    "apps/web",
    "crates/*",
    "bin/*",
]
# apps/mobile — вне workspace, пока нет мобильных toolchain'ов.
exclude = ["apps/mobile"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"

[workspace.dependencies]
dioxus = { version = "0.7.1" }

# workspace
ui = { path = "apps/ui" }
desktop = { path = "apps/desktop" }
focus-api-types = { path = "crates/api-types" }
focus-api-contract-tests = { path = "crates/api-contract-tests" }
focus-core = { path = "crates/core" }
focus-storage = { path = "crates/storage" }
focus-plugin-api = { path = "crates/plugin-api" }
focus-plugin-jira = { path = "crates/plugin-jira" }
focus-api-rest = { path = "crates/api-rest" }
focus-api-mcp = { path = "crates/api-mcp" }
# фичи сервера (notify, позже jira/mcp) выбирает потребитель
focus-server = { path = "crates/server", default-features = false }

# сервис
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros", "chrono", "uuid", "json"] }
# Базовый reqwest — без TLS: так его берёт `apps/ui` (сервис локальный, http;
# в wasm — fetch). TLS (`rustls`) и `http2` включает плагин Jira у себя.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream"] }
rmcp = { version = "3.7.0", features = ["server", "transport-streamable-http-server"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.7", features = ["derive"] }
anyhow = "1.0.104"
# сервер: data dir, токен, уведомления, остановка фоновых задач
directories = "6.0.0"
getrandom = "0.3.4"
notify-rust = "4.18.2"
tokio-util = "0.7.20"
# тесты REST: вызов роутера без сети, чтение тела ответа
tower = { version = "0.5.3", features = ["util"] }
http-body-util = "0.1.5"

# общие (в том числе для api-types → wasm)
async-trait = "0.1.92"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock", "serde"] }
uuid = { version = "1.29.0", features = ["v7", "serde"] }
# ядро: асинхронный мьютекс без привязки к runtime; исполнитель — только в тестах
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
futures-executor = "0.3.34"
# ui: таймер, одинаковый на desktop и в wasm (в wasm — фича `wasm-bindgen`)
futures-timer = "3.0.3"
# тесты хранилища: временные файлы БД
tempfile = "3.27.0"
# тесты плагина Jira: HTTP-заглушка вместо настоящей Jira
wiremock = "0.6.5"

# Release-профиль веб-версии: `dx bundle --platform web --release` берёт
# `wasm-release` сам (без него dx создаёт такой профиль на лету с opt-level "s").
# Сервис и desktop собираются своими профилями и его не видят. `strip` не
# задаём: dx на время сборки всё равно ставит strip=false (по символам он
# находит ассеты), отладочное вырезает wasm-opt (`--debug-symbols=false`).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
