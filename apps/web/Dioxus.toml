[application]
# Статика без хэшей в имени (иконки, manifest, service worker) — в корень сайта.
public_dir = "public"

[web.app]
title = "Focus Flow — таймер фокуса 50/10"
base_path = "focus-flow"

# В release dx прогоняет wasm-opt сам. DWARF вырезается, только если собирать
# с `--debug-symbols=false`: у dx 0.7 он по умолчанию включён и в release.
[web.wasm_opt]
level = "z"
