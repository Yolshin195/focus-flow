<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>{app_title}</title>
    <meta name="description" content="Трекер фокуса 50/10: 50 минут работы над одним пунктом, 10 минут отдыха и честный учёт потерянного времени. Демо в браузере — без регистрации и без сервера.">
    <meta name="theme-color" content="#0f1115">
    <meta name="color-scheme" content="dark">
    <link rel="icon" href="/{base_path}/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/{base_path}/icon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="/{base_path}/apple-touch-icon.png">
    <link rel="manifest" href="/{base_path}/manifest.webmanifest">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Focus Flow">
    <meta property="og:locale" content="ru_RU">
    <meta property="og:title" content="Focus Flow — таймер фокуса 50/10">
    <meta property="og:description" content="Трекер фокуса 50/10: 50 минут работы над одним пунктом, 10 минут отдыха и честный учёт потерянного времени. Демо в браузере — без регистрации и без сервера.">
    <meta property="og:url" content="https://yolshin195.github.io/focus-flow/">
    <meta property="og:image" content="https://yolshin195.github.io/focus-flow/og.png">
    <meta property="og:image:width" content="1180">
    <meta property="og:image:height" content="780">
    <meta property="og:image:alt" content="Экран «Фокус»: циферблат из минутных рисок, идёт работа над пунктом">
    <meta name="twitter:card" content="summary_large_image">

    <!-- dx вставляет сюда preload JS-обвязки -->
    {style_include}
    <script>
      // wasm начинает качаться сразу, а не после JS-обвязки. Safari (и все
      // браузеры iOS) не переиспользует preload as=fetch и скачал бы файл
      // дважды, поэтому ему подсказки нет.
      if (navigator.vendor !== "Apple Computer, Inc.") {
        var wasm = document.createElement("link");
        wasm.rel = "preload";
        wasm.as = "fetch";
        wasm.type = "application/wasm";
        wasm.crossOrigin = "anonymous";
        wasm.href = "/{base_path}/{wasm_path}";
        document.head.appendChild(wasm);
      }
    </script>
    <!-- Шрифты каркаса и первого кадра: в порядке появления на экране. -->
    <link rel="preload" href="/{base_path}/assets/fonts/inter-cyrillic-500-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/{base_path}/assets/fonts/inter-cyrillic-600-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/{base_path}/assets/fonts/inter-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/{base_path}/assets/fonts/inter-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/{base_path}/assets/fonts/jetbrains-mono-latin-300-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/{base_path}/assets/fonts/inter-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/{base_path}/assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/{base_path}/assets/fonts/jetbrains-mono-latin-500-normal.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/{base_path}/assets/fonts/jetbrains-mono-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Critical CSS: дословные правила из apps/ui/assets/tokens.css и
         main.css для оболочки и экрана «Фокус» в первом кадре. Сверяет тест
         apps/web/tests/skeleton.rs — правьте источник и копируйте сюда. -->
    <style id="critical">
    :root {
      color-scheme: dark;

      /* Поверхности: фон → панель → карточка → поднятое */
      --bg: #0f1115;
      --bg-sidebar: #0c0e11;
      --surface-1: #15181d;
      --surface-2: #1b1f25;
      --surface-3: #232831;
      --scrim: rgba(6, 7, 9, 0.72);

      /* Линии */
      --line: rgba(255, 255, 255, 0.06);
      --line-strong: rgba(255, 255, 255, 0.11);

      /* Текст */
      --text: #e9ebef;
      --text-2: #a3a9b4;
      --text-3: #6c7380;
      --text-on-accent: #0b0d10;

      /* Сессии — одни и те же везде */
      --work: #5b8cff;
      --work-soft: rgba(91, 140, 255, 0.14);
      --work-glow: rgba(91, 140, 255, 0.10);
      --rest: #3dd68c;
      --rest-soft: rgba(61, 214, 140, 0.14);
      --rest-glow: rgba(61, 214, 140, 0.08);
      --planning: #f5b841;
      --planning-soft: rgba(245, 184, 65, 0.14);
      --planning-glow: rgba(245, 184, 65, 0.07);
      /* Непрозрачные заливки блоков шкалы дня */
      --work-block: #1a2335;
      --rest-block: #14271f;
      --planning-block: #2a2417;
      --interrupted-block: #2d1c20;
      --lost: #5b616c;
      --lost-soft: rgba(91, 97, 108, 0.22);
      --interrupted: #d9686e;
      --interrupted-soft: rgba(217, 104, 110, 0.14);

      /* Шрифты. «… Fallback» — системные шрифты с метриками под Inter и
         JetBrains Mono (объявлены в index.html веб-версии): пока грузятся
         настоящие, текст не меняет размеров. На desktop их нет — пропускаются. */
      --font-ui: "Inter", "Inter Fallback", system-ui, -apple-system, "Segoe UI", sans-serif;
      --font-num: "JetBrains Mono", "JetBrains Mono Fallback", ui-monospace, "SF Mono", monospace;

      /* Шкала размеров (≈ 1.2) */
      --fs-xs: 12px;
      --fs-sm: 13px;
      --fs-md: 14px;
      --fs-lg: 16px;
      --fs-xl: 20px;
      --fs-2xl: 26px;
      --fs-timer: 76px;

      /* Отступы: шаг 4 */
      --sp-1: 4px;
      --sp-2: 8px;
      --sp-3: 12px;
      --sp-4: 16px;
      --sp-5: 20px;
      --sp-6: 24px;
      --sp-8: 32px;
      --sp-10: 40px;
      --sp-12: 48px;

      /* Радиусы: по иерархии */
      --r-xs: 4px;
      --r-sm: 6px;
      --r-md: 10px;
      --r-lg: 14px;
      --r-pill: 999px;

      /* Тени — только у плавающего */
      --shadow-float: 0 24px 64px rgba(0, 0, 0, 0.55), 0 2px 8px rgba(0, 0, 0, 0.35);

      /* Движение */
      --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
      --t-fast: 120ms;
      --t-med: 240ms;
      --t-slow: 900ms;

      --sidebar-w: 76px;
      /* Нижние вкладки на телефоне (без отступа под жест «домой») */
      --tabbar-h: 56px;
      --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px rgba(233, 235, 239, 0.55);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }
    html,
    body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-ui);
      font-size: var(--fs-md);
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "cv11", "ss01";
      overflow: hidden;
    }
    button,
    input {
      font: inherit;
      color: inherit;
    }
    button {
      cursor: pointer;
      background: none;
      border: 0;
      padding: 0;
    }
    button:disabled {
      cursor: default;
    }
    .num {
      font-family: var(--font-num);
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.01em;
    }
    .icon {
      flex: none;
      display: block;
    }
    .app {
      height: 100%;
    }
    .shell {
      display: grid;
      grid-template-columns: var(--sidebar-w) minmax(0, 1fr);
      height: 100vh;
      height: 100dvh;
    }
    .sidebar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-6);
      padding: var(--sp-5) 0 var(--sp-5);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--line);
    }
    .brand {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
    }
    .brand-track {
      fill: none;
      stroke: var(--line-strong);
      stroke-width: 3;
    }
    .brand-arc {
      fill: none;
      stroke: var(--work);
      stroke-width: 3;
      stroke-linecap: round;
    }
    .nav {
      display: flex;
      flex-direction: column;
      gap: var(--sp-2);
      width: 100%;
      padding: 0 var(--sp-2);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 10px 0 8px;
      border-radius: var(--r-md);
      color: var(--text-3);
      text-decoration: none;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.01em;
      transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
    }
    .nav-item:hover {
      color: var(--text-2);
      background: var(--surface-1);
    }
    .nav-item.active {
      color: var(--text);
      background: var(--surface-2);
    }
    .nav-bottom {
      margin-top: auto;
    }
    .nav-bottom + .side-progress {
      margin-top: 0;
    }
    .side-progress {
      margin-top: auto;
      width: 100%;
      padding: 0 var(--sp-3);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .side-progress-value {
      font-size: var(--fs-sm);
      font-weight: 500;
      color: var(--text);
      line-height: 1.2;
    }
    .side-progress-of {
      font-size: 11px;
      color: var(--text-3);
      white-space: nowrap;
    }
    .side-progress-bar {
      width: 100%;
      height: 3px;
      margin-top: var(--sp-2);
      border-radius: var(--r-pill);
      background: var(--surface-3);
      overflow: hidden;
    }
    .side-progress-fill {
      height: 100%;
      background: var(--work);
      border-radius: inherit;
      transition: width var(--t-slow) var(--ease);
    }
    .screen {
      position: relative;
      min-width: 0;
      height: 100vh;
      height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
      height: 40px;
      padding: 0 var(--sp-5);
      border-radius: var(--r-md);
      font-size: var(--fs-md);
      font-weight: 500;
      white-space: nowrap;
      transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
        opacity var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
    }
    .btn:disabled {
      opacity: 0.38;
    }
    .btn-primary:disabled,
    .btn-primary.btn-work:disabled,
    .btn-primary.btn-planning:disabled {
      opacity: 1;
      background: var(--surface-2);
      color: var(--text-3);
      box-shadow: inset 0 0 0 1px var(--line-strong);
    }
    .btn-primary {
      height: 48px;
      min-width: 200px;
      padding: 0 var(--sp-8);
      font-size: var(--fs-lg);
      font-weight: 600;
      color: var(--text-on-accent);
      background: var(--text);
    }
    .btn-primary.btn-work {
      background: var(--work);
      color: #fff;
    }
    .btn-quiet {
      color: var(--text-2);
    }
    .reserved {
      visibility: hidden;
    }
    .focus {
      position: relative;
      display: flex;
      flex-direction: column;
      min-height: 100%;
      padding: var(--sp-6) var(--sp-10) var(--sp-8);
      isolation: isolate;
      overflow: hidden;
    }
    .focus::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 46%;
      width: 760px;
      height: 760px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: radial-gradient(closest-side, var(--glow, transparent), transparent 70%);
      z-index: -1;
      transition: background var(--t-slow) var(--ease);
      pointer-events: none;
    }
    .focus-idle { --accent: var(--text-3); --glow: transparent; }
    .focus-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: var(--sp-6);
      min-height: 40px;
    }
    .day-meta {
      color: var(--text-3);
      font-size: var(--fs-sm);
      padding-top: 2px;
    }
    .norm {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: var(--sp-2);
      width: 220px;
    }
    .norm-text {
      font-size: var(--fs-sm);
      color: var(--text-3);
    }
    .norm-bar {
      display: flex;
      width: 100%;
      height: 4px;
      gap: 2px;
      border-radius: var(--r-pill);
      background: var(--surface-3);
      overflow: hidden;
    }
    .norm-seg {
      height: 100%;
      min-width: 0;
      transition: width var(--t-slow) var(--ease);
    }
    .norm-seg:empty[style*="width: 0.000%"] {
      display: none;
    }
    .focus-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding-bottom: var(--sp-6);
    }
    .session-label {
      font-size: var(--fs-lg);
      font-weight: 500;
      color: var(--accent);
      letter-spacing: 0.01em;
      margin-bottom: var(--sp-5);
      transition: color var(--t-med) var(--ease);
    }
    .focus-idle .session-label {
      color: var(--text-2);
    }
    .ring {
      position: relative;
      width: 340px;
      height: 340px;
      flex: none;
    }
    .ring-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .tick {
      stroke: var(--surface-3);
      stroke-width: 2.4;
      stroke-linecap: round;
      transition: stroke var(--t-med) var(--ease);
    }
    .tick.on {
      stroke: var(--accent);
    }
    .tick.edge {
      stroke: var(--text);
    }
    .ring-idle .tick.on {
      stroke: #343a45;
    }
    .ring-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.04);
      stroke-width: 2;
    }
    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-opacity: 0.55;
      stroke-width: 2;
      stroke-linecap: round;
      transition: stroke-dashoffset 1s linear, stroke var(--t-med) var(--ease);
    }
    .ring-idle .ring-progress {
      opacity: 0;
    }
    .ring-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: var(--sp-2);
    }
    .ring-digits {
      font-size: var(--fs-timer);
      font-weight: 300;
      line-height: 1;
      letter-spacing: -0.045em;
      color: var(--text);
    }
    .ring-idle .ring-digits {
      color: var(--text-3);
    }
    .ring-sub {
      font-size: var(--fs-sm);
      color: var(--text-3);
    }
    .focus-context {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-2);
      width: min(520px, 100%);
      min-height: 64px;
      margin-top: var(--sp-6);
      text-align: center;
    }
    .item-field {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--sp-4);
      width: 100%;
      min-height: 56px;
      padding: var(--sp-3) var(--sp-4) var(--sp-3) var(--sp-5);
      border-radius: var(--r-lg);
      background: var(--surface-1);
      border: 1px solid var(--line-strong);
      color: var(--text-3);
      text-align: left;
      transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
    }
    .focus-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: var(--sp-2);
      margin-top: var(--sp-6);
      min-height: 48px;
    }
    .key-hint {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: var(--sp-3);
      font-size: var(--fs-xs);
      color: var(--text-3);
    }
    kbd {
      padding: 1px 6px;
      border-radius: var(--r-xs);
      border: 1px solid var(--line-strong);
      border-bottom-width: 2px;
      font-family: var(--font-ui);
      font-size: 11px;
      color: var(--text-2);
    }
    .lost-note {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: var(--sp-4);
      font-size: var(--fs-sm);
      color: var(--text-3);
    }
    .lost-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--lost);
    }
    @media (max-height: 760px) {
      .focus {
        padding-top: var(--sp-5);
        padding-bottom: var(--sp-5);
      }

      .ring {
        width: 280px;
        height: 280px;
      }

      .ring-digits {
        font-size: 64px;
      }

      .session-label {
        margin-bottom: var(--sp-3);
      }

      .focus-context {
        margin-top: var(--sp-4);
        min-height: 56px;
      }

      .focus-actions {
        margin-top: var(--sp-4);
      }

      .focus-stage {
        padding-bottom: 0;
      }
    }
    @media (max-height: 680px) {
      .ring {
        width: 244px;
        height: 244px;
      }

      .ring-digits {
        font-size: 56px;
      }

      .focus-actions .btn-primary {
        height: 44px;
      }

      .lost-note {
        margin-top: var(--sp-2);
      }
    }
    @media (max-width: 639px) {
      .shell {
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: minmax(0, 1fr) auto;
      }

      .screen {
        grid-row: 1;
        height: auto;
        min-height: 0;
      }

      .sidebar {
        grid-row: 2;
        position: relative;
        flex-direction: row;
        align-items: stretch;
        gap: 0;
        padding: 0 env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
        border-right: 0;
        border-top: 1px solid var(--line);
      }

      .brand {
        display: none;
      }

      .nav {
        flex: 3 1 0;
        flex-direction: row;
        gap: 0;
        padding: 0;
      }

      .nav-bottom {
        flex: 1 1 0;
        margin-top: 0;
      }

      .nav-item {
        flex: 1 1 0;
        justify-content: center;
        gap: 3px;
        min-height: var(--tabbar-h);
        padding: 6px 0 4px;
        border-radius: 0;
      }

      .nav-item:hover,
      .nav-item.active {
        background: none;
      }

      .nav-item.active .icon {
        color: var(--work);
      }

      .side-progress {
        position: absolute;
        top: -1px;
        left: 0;
        right: 0;
        margin: 0;
        padding: 0;
        pointer-events: none;
      }

      .side-progress-value,
      .side-progress-of {
        display: none;
      }

      .side-progress-bar {
        height: 2px;
        margin-top: 0;
        border-radius: 0;
        background: transparent;
      }

      .focus {
        padding: var(--sp-4) var(--sp-4) var(--sp-5);
      }

      .focus::before {
        width: 150vw;
        height: 150vw;
      }

      .focus-top {
        gap: var(--sp-4);
        min-height: 0;
      }

      .norm {
        flex: none;
        width: 136px;
      }

      .focus-stage {
        justify-content: flex-start;
        padding: var(--sp-6) 0 0;
      }

      .session-label {
        margin-bottom: var(--sp-3);
      }

      .ring {
        width: min(76vw, 300px, 40dvh);
        height: min(76vw, 300px, 40dvh);
      }

      .ring-digits {
        font-size: clamp(48px, 15vw, 64px);
      }

      .focus-context {
        min-height: 0;
        margin-top: var(--sp-5);
      }

      .item-title {
        font-size: var(--fs-lg);
        -webkit-line-clamp: 3;
      }

      .focus-actions {
        align-self: stretch;
        margin-top: auto;
        padding-top: var(--sp-5);
      }

      .focus-actions .btn-primary {
        width: 100%;
        min-width: 0;
      }
    }

    /* Сенсорный экран: подсказки клавиатуры не нужны. */
    @media (hover: none) and (pointer: coarse) {
      .key-hint {
        display: none;
      }
    }
    .app:not(.motion) *,
    .app:not(.motion) *::before,
    .app:not(.motion) *::after {
      transition: none !important;
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
    </style>
    <!-- Только для каркаса веб-версии (на desktop шрифты подключает ui/src/fonts.rs). -->
    <style id="boot-style">

    <script>
      // Прямой заход на /tasks, /day, /settings (Pages отдаёт 404.html):
      // в каркасе подсвечен нужный пункт меню, экран «Фокус» не показан.
      (function () {
        var base = "/{base_path}";
        var path = location.pathname;
        var route = (path.indexOf(base) === 0 ? path.slice(base.length) : path).replace(/\/+$/, "");
        if (!route) return;
        var boot = document.getElementById("boot");
        boot.classList.add("boot-route");
        var links = boot.querySelectorAll(".nav-item");
        for (var i = 0; i < links.length; i++) {
          var on = links[i].getAttribute("href") === base + route;
          links[i].classList.toggle("active", on);
          if (on) links[i].setAttribute("aria-current", "page");
          else links[i].removeAttribute("aria-current");
        }
      })();
    </script>
    <script>
      // Офлайн и мгновенный повторный запуск — public/sw.js. Только в
      // release-сборке (у dx serve wasm лежит не в assets/) и после запуска
      // приложения: wasm уже скачан, SW возьмёт его из HTTP-кэша.
      if ("serviceWorker" in navigator && "{wasm_path}".indexOf("assets/") === 0) {
        new MutationObserver(function (_, observer) {
          if (document.getElementById("boot")) return;
          observer.disconnect();
          navigator.serviceWorker.register("/{base_path}/sw.js", {
            scope: "/{base_path}/",
            updateViaCache: "none",
          });
        }).observe(document.getElementById("main"), { childList: true });
      }
    </script>
    <noscript><p class="noscript">Focus Flow работает на WebAssembly — включите JavaScript.</p></noscript>
