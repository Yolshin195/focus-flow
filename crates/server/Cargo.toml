[package]
name = "focus-server"
description = "Сборка сервиса Focus Flow"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["notify"]
# Системные уведомления (`notify-rust`). Без фичи — только запись в лог
# (headless, CI).
notify = ["dep:notify-rust"]
# MCP-вход на `/mcp` (`rmcp`).
mcp = ["dep:focus-api-mcp"]
# Плагин Jira (шаг 7; пока крейт-заготовка).
jira = ["dep:focus-plugin-jira"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }
focus-api-mcp = { workspace = true, optional = true }
focus-api-rest = { workspace = true }
focus-api-types = { workspace = true }
focus-core = { workspace = true }
focus-plugin-api = { workspace = true }
focus-plugin-jira = { workspace = true, optional = true }
focus-storage = { workspace = true }
getrandom = { workspace = true }
notify-rust = { workspace = true, optional = true }
tokio = { workspace = true, features = ["net"] }
serde_json = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
http-body-util = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
